<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Appointment</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <img src="logo.png.jpeg" alt="Gogo Gomo Logo" class="logo">

    <h1>Book Appointment</h1>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
        </ul>
    </nav>
</header>

<main>

<section class="card">

<h2>Appointment Request</h2>

<form action="https://formspree.io/f/mqerojpw" method="POST">

<input type="hidden" name="_next" value="thankyou.html">

<label>Full Name</label>
<input type="text" name="name" required>

<label>Phone Number</label>
<input type="tel" name="phone" required>

<label>Service Required</label>
<input type="text" name="service" required>

<label>Preferred Date</label>
<input type="date" name="date" required>

<label>Message</label>
<textarea name="message"></textarea>

<button type="submit" class="button">
Submit Booking
</button>

</form>

</section>

<section class="card">

<h2>Deposit Information</h2>

<p>
Booking Deposit: <strong>R100</strong>
</p>

<p>
Send proof of payment via WhatsApp after booking.
</p>

</section>

</main>

<a href="https://wa.me/27614540385" class="whatsapp-button">
    WhatsApp
</a>

</body>
</html>
